name: Build webOS

on:
  push:
    branches: [main]
    paths:
      - 'tv-webos/**'
      - '.github/workflows/webos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Empacotar IPK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar webOS CLI
        run: npm install -g @webos-tools/cli

      - name: Empacotar o app
        run: |
          mkdir -p dist
          ares-package tv-webos -o dist --no-minify
          ls -la dist

      - name: Salvar IPK
        uses: actions/upload-artifact@v4
        with:
          name: Reptor-webOS
          path: dist/*.ipk
          if-no-files-found: error

      - name: Publicar para download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/*.ipk dist/Reptor-webOS.ipk
          if gh release view webos-latest >/dev/null 2>&1; then
            gh release upload webos-latest dist/Reptor-webOS.ipk --clobber
          else
            gh release create webos-latest dist/Reptor-webOS.ipk \
              --title "Reptor Player para LG (última versão)" \
              --notes "IPK gerado automaticamente pelo GitHub Actions."
          fi
