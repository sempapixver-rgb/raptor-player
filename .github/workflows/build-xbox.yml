name: Build Xbox (UWP/MSIX)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao do pacote (ex.: 1.2.2.0)'
        required: false
        default: '1.2.2.0'

permissions:
  contents: read

jobs:
  build:
    # VS2022 tem o workload UWP/XAML instalado no runner da GitHub.
    runs-on: windows-2022

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v5

      - name: Aplicar identidade do Partner Center e versao
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "1.2.2.0" }
          $manifest = "xbox\RaptorXbox\Package.appxmanifest"
          [xml]$xml = Get-Content $manifest -Raw
          $xml.Package.Identity.Name = "Raptorplayer.RaptorPlayer"
          $xml.Package.Identity.Publisher = "CN=8060E9B2-8FD9-403D-B8BD-1879A6E2FDCD"
          $xml.Package.Identity.Version = $version
          $xml.Package.Properties.PublisherDisplayName = "Raptor player"
          $xml.Save((Resolve-Path $manifest))
          Write-Host "Identidade: $($xml.Package.Identity.Name) / $($xml.Package.Identity.Publisher)"
          Write-Host "PublisherDisplayName: $($xml.Package.Properties.PublisherDisplayName)"
          Write-Host "Versao do pacote: $version"

      - name: Gerar certificado de build com o Publisher da conta
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=8060E9B2-8FD9-403D-B8BD-1879A6E2FDCD" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Raptor Xbox Build" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $pwd = ConvertTo-SecureString -String "raptor-xbox-build" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "xbox\RaptorXbox\Assets\BuildCert.pfx" -Password $pwd | Out-Null
          Write-Host "Certificado de build criado com o Publisher da conta."

      - name: Restaurar dependencias UWP
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\Current\Bin\amd64\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild nao encontrado." }
          & $msbuild "xbox\RaptorXbox.sln" `
            /t:Restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compilar MSIX x64
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\Current\Bin\amd64\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild nao encontrado." }
          $cert = (Resolve-Path "xbox\RaptorXbox\Assets\BuildCert.pfx").Path
          $packageDir = Join-Path (Get-Location).Path "xbox\RaptorXbox\bin\x64\Release\AppPackages\"
          $msbuildArgs = @(
            "xbox\RaptorXbox\RaptorXbox.csproj"
            "/t:Publish"
            "/p:Configuration=Release"
            "/p:Platform=x64"
            "/p:AppxBundle=Always"
            "/p:AppxBundlePlatforms=x64"
            "/p:AppxPackageDir=$packageDir"
            "/p:AppxPackageSigningEnabled=true"
            "/p:PackageCertificateKeyFile=$cert"
            "/p:PackageCertificatePassword=raptor-xbox-build"
            "/p:UseDotNetNativeToolchain=true"
            "/p:DotNetNativeToolchain=true"
            "/m"
          )
          & $msbuild @msbuildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Path $packageDir -Recurse -File |
            Where-Object { $_.Extension -in ".msixbundle", ".appx", ".appxbundle" } |
            ForEach-Object { Write-Host "PACOTE: $($_.FullName)" }

      - name: Salvar artefato
        uses: actions/upload-artifact@v5
        with:
          name: Raptor-Xbox-MSIX
          path: |
            xbox/RaptorXbox/bin/x64/Release/AppPackages/**/*.msixbundle
            xbox/RaptorXbox/bin/x64/Release/AppPackages/**/*.appxbundle
            xbox/RaptorXbox/bin/x64/Release/AppPackages/**/*.appx
            xbox/RaptorXbox/**/*.msixbundle
            xbox/RaptorXbox/**/*.appx
          if-no-files-found: error
