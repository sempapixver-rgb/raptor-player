name: Build Tizen

on:
  push:
    branches: [main]
    paths:
      - 'tv-tizen/**'
      - '.github/workflows/tizen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Empacotar WGT
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Empacotar o widget Tizen
        run: |
          mkdir -p dist
          cd tv-tizen
          zip -r ../dist/Raptor-Tizen.wgt . -x '*.DS_Store'
          cd ..
          ls -la dist

      - name: Salvar WGT
        uses: actions/upload-artifact@v4
        with:
          name: Raptor-Tizen
          path: dist/*.wgt
          if-no-files-found: error

      # Publicação em release/downloader só entra aqui quando autorizada.
